<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理后台 - 小飞</title>
  <link rel="stylesheet" href="/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Averia+Gruesa+Libre&display=swap" rel="stylesheet">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <h2>
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        管理后台
      </h2>
      <ul class="nav-list">
        <li><a href="/" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span>返回首页</span>
        </a></li>
        <li><a href="/admin" class="nav-item active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
          <span>文章管理</span>
        </a></li>
        <li><a href="/settings" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9c.26.604.852.997 1.51 1H21a2 2 0 010 4h-.09c-.658.003-1.25.396-1.51 1z"/></svg>
          <span>自定义设置</span>
        </a></li>
      </ul>
    </aside>

    <main class="admin-main">
      <div class="admin-header">
        <h1>文章管理</h1>
        <button class="brand-btn" id="new-btn">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          新建文章
        </button>
      </div>
      <div class="data-table" id="table"><div class="loading"></div></div>
    </main>
  </div>

  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h2 id="modal-title">新建文章</h2>
      <form id="form">
        <input type="hidden" id="f-id">
        <div class="form-group">
          <label>标题</label>
          <input type="text" id="f-title" required>
        </div>
        <div class="form-group">
          <label>Slug (URL路径)</label>
          <input type="text" id="f-slug" required placeholder="my-article">
        </div>
        <div class="form-group">
          <label>摘要</label>
          <input type="text" id="f-summary" placeholder="简短描述...">
        </div>
        <div class="form-group">
          <label>标签 (逗号分隔)</label>
          <input type="text" id="f-tags" placeholder="教程, Markdown">
        </div>
        <div class="form-group">
          <label>内容 (Markdown)</label>
          <textarea id="f-content" placeholder="# 标题&#10;&#10;正文内容..."></textarea>
        </div>
        <div class="form-actions">
          <button type="button" class="brand-btn brand-btn-outline" id="cancel-btn">取消</button>
          <button type="submit" class="brand-btn">保存</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/js/admin.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自定义设置 - 小飞</title>
  <link rel="stylesheet" href="/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Averia+Gruesa+Libre&display=swap" rel="stylesheet">
</head>
<body>
  <div class="settings-page">
    <a href="/" class="back-link">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      返回首页
    </a>

    <div class="card card-static settings-card">
      <h1>自定义设置</h1>
      <form id="form">
        <div class="settings-section">
          <h3>站点信息</h3>
          <div class="form-group"><label>站点名称</label><input type="text" id="site-name" name="site_name"></div>
          <div class="form-group"><label>站点描述</label><input type="text" id="site-description" name="site_description"></div>
          <div class="form-group"><label>问候语</label><input type="text" id="greeting" name="greeting"></div>
        </div>

        <div class="settings-section">
          <h3>主题颜色</h3>
          <div class="color-grid">
            <div class="color-input"><input type="color" id="color-brand" name="color_brand"><label>品牌色</label></div>
            <div class="color-input"><input type="color" id="color-brand-secondary" name="color_brand_secondary"><label>副品牌色</label></div>
            <div class="color-input"><input type="color" id="color-primary" name="color_primary"><label>主文字色</label></div>
            <div class="color-input"><input type="color" id="color-secondary" name="color_secondary"><label>副文字色</label></div>
            <div class="color-input"><input type="color" id="color-bg" name="color_bg"><label>背景色</label></div>
            <div class="color-input"><input type="color" id="color-border" name="color_border"><label>边框色</label></div>
          </div>
        </div>

        <div class="settings-section">
          <h3>社交链接</h3>
          <div class="form-group"><label>GitHub</label><input type="url" id="github-url" name="github_url" placeholder="https://github.com/..."></div>
          <div class="form-group"><label>Bilibili</label><input type="url" id="bilibili-url" name="bilibili_url" placeholder="https://space.bilibili.com/..."></div>
          <div class="form-group"><label>小红书</label><input type="url" id="xiaohongshu-url" name="xiaohongshu_url" placeholder="https://xhslink.com/..."></div>
          <div class="form-group"><label>Email</label><input type="email" id="email" name="email" placeholder="your@email.com"></div>
        </div>

        <div class="form-actions">
          <button type="button" class="brand-btn brand-btn-outline" id="reset-btn">恢复默认</button>
          <button type="submit" class="brand-btn">保存设置</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="/js/settings.js"></script>
</body>
</html>

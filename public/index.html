<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小飞</title>
  <meta name="description" content="wiki">
  <link rel="stylesheet" href="/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Averia+Gruesa+Libre&display=swap" rel="stylesheet">
</head>
<body>
  <canvas id="bg-canvas"></canvas>

  <div class="home-wrapper">
    <div class="home-grid">

      <div class="card hi-card">
        <img class="hi-avatar" src="/avatar.jpg" alt="avatar" onerror="this.src='https://api.dicebear.com/9.x/avataaars/svg?seed=xiaofei'">
        <div class="hi-title" id="site-title">小飞</div>
        <div class="hi-status" id="site-status">wiki</div>
        <div class="hi-greeting" id="site-greeting">Good Night</div>
      </div>

      <div class="card nav-card">
        <a href="/" class="nav-header">
          <img class="nav-header-avatar" src="/avatar.jpg" alt="avatar" onerror="this.src='https://api.dicebear.com/9.x/avataaars/svg?seed=xiaofei'">
          <span class="nav-header-title">小飞</span>
        </a>
        <div class="nav-section-label">General</div>
        <ul class="nav-list">
          <li><a href="/blog" class="nav-item active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg>
            <span>近期文章</span>
          </a></li>
          <li><a href="/projects" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/></svg>
            <span>我的项目</span>
          </a></li>
          <li><a href="/about" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
            <span>关于网站</span>
          </a></li>
          <li><a href="/share" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
            <span>推荐分享</span>
          </a></li>
          <li><a href="/bloggers" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>
            <span>优秀博客</span>
          </a></li>
        </ul>
      </div>

      <div class="card clock-card">
        <div class="clock-time">
          <span id="clock-h">00</span>
          <span class="clock-sep">:</span>
          <span id="clock-m">00</span>
          <span class="clock-seconds" id="clock-s"></span>
        </div>
      </div>

      <div class="card calendar-card">
        <div class="cal-header">
          <button class="cal-nav-btn" id="cal-prev">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <span class="cal-title" id="cal-title"></span>
          <button class="cal-nav-btn" id="cal-next">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>
        <div class="cal-weekdays">
          <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
        </div>
        <div class="cal-days" id="cal-days"></div>
      </div>

      <div class="card music-card">
        <div class="music-player">
          <div class="music-icon">
            <svg viewBox="0 0 24 24" fill="none"><defs><linearGradient id="mg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="var(--color-brand)"/><stop offset="100%" stop-color="var(--color-brand-secondary)"/></linearGradient></defs><path fill="url(#mg)" d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
          </div>
          <div class="music-info">
            <div class="music-title">Close To You</div>
            <div class="music-progress" id="music-progress">
              <div class="music-progress-fill" id="music-fill" style="width:0%"></div>
            </div>
          </div>
          <button class="music-play-btn" id="music-play">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          </button>
        </div>
      </div>

      <div class="card social-card">
        <div class="social-grid" id="social-grid">
          <a href="#" class="social-btn github">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
            <span>GitHub</span>
          </a>
          <a href="#" class="social-btn bilibili">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.813 4.653h.854c1.51.054 2.769.578 3.773 1.574 1.004.995 1.524 2.249 1.56 3.76v7.36c-.036 1.51-.556 2.769-1.56 3.773s-2.262 1.524-3.773 1.56H5.333c-1.51-.036-2.769-.556-3.773-1.56S.036 18.858 0 17.347v-7.36c.036-1.511.556-2.765 1.56-3.76 1.004-.996 2.262-1.52 3.773-1.574h.774l-1.174-1.12a1.234 1.234 0 0 1-.373-.906c0-.356.124-.658.373-.907l.027-.027c.267-.249.573-.373.92-.373.347 0 .653.124.92.373L9.653 4.44c.071.071.134.142.187.213h4.267a.836.836 0 0 1 .16-.213l2.853-2.747c.267-.249.573-.373.92-.373.347 0 .662.151.929.4.267.249.391.551.391.907 0 .355-.124.657-.373.906zM5.333 7.24c-.746.018-1.373.276-1.88.773-.506.498-.769 1.13-.786 1.894v7.52c.017.764.28 1.395.786 1.893.507.498 1.134.756 1.88.773h13.334c.746-.017 1.373-.275 1.88-.773.506-.498.769-1.129.786-1.893v-7.52c-.017-.765-.28-1.396-.786-1.894-.507-.497-1.134-.755-1.88-.773zM8 11.107c.373 0 .684.124.933.373.25.249.383.569.4.96v1.173c-.017.391-.15.711-.4.96-.249.25-.56.374-.933.374s-.684-.125-.933-.374c-.25-.249-.383-.569-.4-.96V12.44c0-.373.129-.689.386-.947.258-.257.574-.386.947-.386zm8 0c.373 0 .684.124.933.373.25.249.383.569.4.96v1.173c-.017.391-.15.711-.4.96-.249.25-.56.374-.933.374s-.684-.125-.933-.374c-.25-.249-.383-.569-.4-.96V12.44c.017-.391.15-.711.4-.96.249-.249.56-.373.933-.373z"/></svg>
            <span>Bilibili</span>
          </a>
          <a href="#" class="social-btn xiaohongshu">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4" fill="#ff2442"/><text x="12" y="15" text-anchor="middle" fill="#fff" font-size="7" font-weight="bold" font-family="sans-serif">小红书</text></svg>
            <span>小红书</span>
          </a>
          <a href="#" class="social-btn email-btn">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
            <span>Email</span>
          </a>
        </div>
      </div>

      <div class="card article-card" id="latest-article" onclick="goToArticle()">
        <div class="article-card-label">Latest Article</div>
        <div class="article-card-inner">
          <div class="article-card-cover"></div>
          <div class="article-card-info">
            <div class="article-card-title" id="latest-title">加载中...</div>
            <div class="article-card-date" id="latest-date"></div>
          </div>
        </div>
      </div>

      <div class="card share-card">
        <div class="share-label">Random Share</div>
        <div class="share-inner">
          <div class="share-icon">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
          </div>
          <div class="share-info">
            <div class="share-title">Unmanned Aerial Vehicle</div>
            <div class="share-desc">无人机，飞控、传感器与任务规划</div>
            <div class="share-stats">Views: 14,322 · Marks: 269</div>
          </div>
        </div>
      </div>

      <div class="card card-static like-wrapper">
        <button class="like-btn" id="like-btn">
          <svg viewBox="0 0 24 24" fill="currentColor" class="heart-icon"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
          <span class="like-count" id="like-count">0</span>
        </button>
      </div>

    </div>
  </div>

  <div class="write-btn-float">
    <a href="/admin">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      写文章
    </a>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>

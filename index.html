<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ivy-neko - 个人主页</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- 背景光斑 -->
    <div class="bg-decoration">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="container">
        <!-- 左侧边栏 -->
        <aside class="sidebar-left">
            <div class="card nav-card">
                <div class="site-header">
                    <div class="site-logo">
                        <span class="logo-icon">🐱</span>
                        <span class="site-name">Ivy-neko</span>
                        <span class="site-status">（开发中）</span>
                    </div>
                </div>
                <nav class="main-nav">
                    <div class="nav-section-title">GENERAL</div>
                    <ul class="nav-list">
                        <li class="nav-item">
                            <span class="nav-icon">📄</span>
                            <span class="nav-text">近期文章</span>
                        </li>
                        <li class="nav-item">
                            <span class="nav-icon">🧩</span>
                            <span class="nav-text">我的项目</span>
                        </li>
                        <li class="nav-item">
                            <span class="nav-icon">😊</span>
                            <span class="nav-text">关于网站</span>
                        </li>
                        <li class="nav-item">
                            <span class="nav-icon">⭐</span>
                            <span class="nav-text">推荐分享</span>
                        </li>
                        <li class="nav-item active">
                            <span class="nav-icon">🌐</span>
                            <span class="nav-text">优秀博客</span>
                        </li>
                    </ul>
                </nav>
            </div>

            <!-- 最新文章小卡片 -->
            <div class="card article-mini-card">
                <div class="card-header">最新文章</div>
                <div class="mini-article">
                    <div class="mini-article-thumb">
                        <img src="https://api.dicebear.com/7.x/notionists/svg?seed=article1" alt="文章配图">
                    </div>
                    <div class="mini-article-info">
                        <h4 class="mini-article-title">500h播客纪念&分享</h4>
                        <p class="mini-article-desc">可以听到了许多有趣的视角</p>
                        <span class="mini-article-date">2026/4/22</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- 中间主区域 -->
        <main class="main-content">
            <!-- 照片墙 -->
            <div class="card photo-wall-card">
                <div class="photo-wall">
                    <div class="photo-item photo-large">
                        <img src="https://api.dicebear.com/7.x/fun-emoji/svg?seed=cat1&backgroundColor=b6e3f4" alt="猫咪">
                    </div>
                    <div class="photo-item">
                        <img src="https://api.dicebear.com/7.x/fun-emoji/svg?seed=cat2&backgroundColor=c0aede" alt="猫咪">
                    </div>
                    <div class="photo-item">
                        <img src="https://api.dicebear.com/7.x/fun-emoji/svg?seed=cat3&backgroundColor=ffd5dc" alt="猫咪">
                    </div>
                    <div class="photo-item">
                        <img src="https://api.dicebear.com/7.x/fun-emoji/svg?seed=cat4&backgroundColor=ffdfbf" alt="猫咪">
                    </div>
                    <div class="photo-item">
                        <img src="https://api.dicebear.com/7.x/fun-emoji/svg?seed=cat5&backgroundColor=d1f4e0" alt="猫咪">
                    </div>
                </div>
            </div>

            <!-- 个人介绍 -->
            <div class="card profile-card">
                <div class="profile-avatar">
                    <img src="https://api.dicebear.com/7.x/notionists/svg?seed=ivy&backgroundColor=ffdfbf" alt="Ivy头像">
                </div>
                <div class="profile-greeting">Good Night</div>
                <div class="profile-intro">
                    I'm <span class="highlight-name">Ivy</span>, Nice to<br>meet you!
                </div>
            </div>

            <!-- 社交链接 -->
            <div class="social-links">
                <a href="#" class="social-btn github">
                    <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
                    <span>Github</span>
                </a>
                <a href="#" class="social-btn bilibili">
                    <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M17.813 4.653h.854c1.51.054 2.769.578 3.773 1.574 1.004.995 1.524 2.249 1.56 3.76v7.36c-.036 1.51-.556 2.769-1.56 3.773s-2.262 1.524-3.773 1.56H5.333c-1.51-.036-2.769-.556-3.773-1.56S.036 18.858 0 17.347v-7.36c.036-1.511.556-2.765 1.56-3.76 1.004-.996 2.262-1.52 3.773-1.574h.774l-1.174-1.12a1.234 1.234 0 0 1-.373-.906c0-.356.124-.658.373-.907l.027-.027c.267-.249.573-.373.92-.373.347 0 .653.124.92.373L9.653 4.44c.071.071.134.142.187.213h4.267a.836.836 0 0 1 .16-.213l2.853-2.747c.267-.249.573-.373.92-.373.347 0 .662.151.929.4.267.249.391.551.391.907 0 .355-.124.657-.373.906zM5.333 7.24c-.746.018-1.373.276-1.88.773-.506.498-.769 1.13-.786 1.894v7.52c.017.764.28 1.395.786 1.893.507.498 1.134.756 1.88.773h13.334c.746-.017 1.373-.275 1.88-.773.506-.498.769-1.129.786-1.893v-7.52c-.017-.765-.28-1.396-.786-1.894-.507-.497-1.134-.755-1.88-.773zM8 11.107c.373 0 .684.124.933.373.25.249.383.569.4.96v1.173c-.017.391-.15.711-.4.96-.249.25-.56.374-.933.374s-.684-.125-.933-.374c-.25-.249-.383-.569-.4-.96V12.44c0-.373.129-.689.386-.947.258-.257.574-.386.947-.386zm8 0c.373 0 .684.124.933.373.25.249.383.569.4.96v1.173c-.017.391-.15.711-.4.96-.249.25-.56.374-.933.374s-.684-.125-.933-.374c-.25-.249-.383-.569-.4-.96V12.44c.017-.391.15-.711.4-.96.249-.249.56-.373.933-.373z"/></svg>
                    <span>Bilibili</span>
                </a>
                <a href="#" class="social-btn xiaohongshu">
                    <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm4.615 14.615h-2.77v-4.615h-2.77v4.615H8.308V7.385h2.77v4.615h2.77V7.385h2.77v9.23z"/></svg>
                    <span>小红书</span>
                </a>
                <a href="#" class="social-btn email">
                    <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                </a>
            </div>

            <!-- 随机推荐 -->
            <div class="card recommend-card">
                <div class="card-header">随机推荐</div>
                <div class="recommend-content">
                    <div class="recommend-icon">
                        <svg viewBox="0 0 24 24" width="32" height="32"><path fill="currentColor" d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                    </div>
                    <div class="recommend-info">
                        <h4 class="recommend-title">Unmanned Aerial Vehicle</h4>
                        <p class="recommend-desc">无人机，飞控、传感器与任务规划。</p>
                        <div class="recommend-stats">
                            <span>Views: 14,322</span>
                            <span>Marks: 269</span>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- 右侧边栏 -->
        <aside class="sidebar-right">
            <!-- 写文章按钮 -->
            <div class="write-btn-wrapper">
                <button class="write-btn">
                    <span class="write-icon">✏️</span>
                    <span>写文章</span>
                </button>
            </div>

            <!-- 电子时钟 -->
            <div class="card clock-card">
                <div class="digital-clock" id="clock">
                    <span class="time-digit" id="hours">23</span>
                    <span class="time-separator">:</span>
                    <span class="time-digit" id="minutes">18</span>
                </div>
            </div>

            <!-- 日历 -->
            <div class="card calendar-card">
                <div class="calendar-header">
                    <span id="calendar-date">2026/6/17 周三</span>
                </div>
                <div class="calendar-body">
                    <div class="calendar-weekdays">
                        <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
                    </div>
                    <div class="calendar-days" id="calendar-days">
                        <!-- 由 JS 生成 -->
                    </div>
                </div>
            </div>

            <!-- 音乐播放器 -->
            <div class="card music-card">
                <div class="music-player">
                    <div class="music-icon">🎵</div>
                    <div class="music-info">
                        <div class="music-title">Close To You</div>
                        <div class="music-progress">
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: 45%"></div>
                            </div>
                        </div>
                    </div>
                    <button class="music-play-btn" id="play-btn">
                        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
                    </button>
                </div>
            </div>

            <!-- 点赞 -->
            <div class="card like-card">
                <button class="like-btn" id="like-btn">
                    <svg viewBox="0 0 24 24" width="24" height="24" class="heart-icon"><path fill="currentColor" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                    <span class="like-count" id="like-count">18988</span>
                </button>
            </div>
        </aside>
    </div>

    <script src="script.js"></script>
</body>
</html>
